<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maruti Consultancy - Telegram Join</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* CSS Variables for Easy Customization */
        :root {
            --bg-gradient: radial-gradient(circle at center, #0a2417 0%, #030a07 100%);
            --gold-primary: #e5c158;
            --gold-secondary: #c29931;
            --text-muted: #8fa095;
            --text-light: #e2e8f0;
            --telegram-blue: #229ED9;
        }

        /* Reset & Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* Container designed to look like a premium mobile layout */
        .container {
            width: 100%;
            max-width: 450px;
            min-height: 100vh;
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            text-align: center;
            position: relative;
        }

        /* 1. Header Badge */
        .header-badge {
            border: 1px solid rgba(229, 193, 88, 0.3);
            background: rgba(229, 193, 88, 0.03);
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            color: var(--gold-primary);
            text-transform: uppercase;
            margin-bottom: 20px;
            box-shadow: inset 0 0 10px rgba(229, 193, 88, 0.05);
        }

        /* 2. Central Decorative Rings & Logo */
        .logo-outer-ring {
            width: 210px;
            height: 210px;
            border: 1.5px dashed rgba(229, 193, 88, 0.4);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 25px;
        }

        .logo-inner-ring {
            width: 194px;
            height: 194px;
            border: 1px solid rgba(229, 193, 88, 0.6);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Decorative glowing orbit dot */
        .logo-inner-ring::after {
            content: '';
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: var(--gold-primary);
            border-radius: 50%;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            box-shadow: 0 0 8px var(--gold-primary);
        }

        .logo-core {
            width: 176px;
            height: 176px;
            background-color: #040806;
            border: 2px solid var(--gold-primary);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            padding: 10px;
        }

        /* SVG Logo Representation */
        .logo-svg {
            width: 120px;
            height: auto;
        }

        /* 3. Typography & Titles */
        .brand-title {
            font-family: 'Cinzel', serif;
            font-size: 1.7rem;
            font-weight: 700;
            color: var(--gold-primary);
            letter-spacing: 0.05em;
            line-height: 1.2;
            margin-bottom: 8px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }

        .brand-subtitle {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            color: var(--gold-primary);
            opacity: 0.9;
            margin-bottom: 15px;
        }

        .brand-taglines {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 400;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 35px;
        }

        .diamond-separator {
            color: var(--gold-primary);
            font-size: 0.6rem;
        }

        /* 4. Action Area (CTA) */
        .cta-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .tap-to-join {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            color: var(--gold-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .arrow-down {
            font-size: 0.9rem;
            animation: bounce 1.5s infinite;
        }

        .join-btn {
            width: 100%;
            max-width: 320px;
            background: linear-gradient(135deg, #f5cc5b 0%, #b88f24 100%);
            border: none;
            border-radius: 12px;
            padding: 16px 24px;
            font-family: 'Cinzel', serif;
            font-size: 1.05rem;
            font-weight: 700;
            color: #0a2417;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 6px 20px rgba(229, 193, 88, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .join-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(229, 193, 88, 0.45);
        }

        .join-btn:active {
            transform: translateY(1px);
        }

        .telegram-icon {
            width: 20px;
            height: 20px;
            fill: #0a2417;
        }

        /* 5. Progress Bar & Footer Details */
        .progress-container {
            width: 100%;
            max-width: 320px;
            margin-top: 5px;
        }

        .timer-text {
            font-size: 0.75rem;
            color: var(--text-light);
            margin-bottom: 6px;
            font-weight: 400;
        }

        .timer-seconds {
            color: var(--gold-primary);
            font-weight: 700;
        }

        .progress-bar-bg {
            width: 100%;
            height: 4px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar-fill {
            width: 100%; /* Dynamically controlled by JS */
            height: 100%;
            background-color: var(--gold-primary);
            border-radius: 2px;
            transition: width 1s linear;
        }

        .guarantees {
            font-size: 0.7rem;
            color: var(--text-muted);
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 15px;
        }

        .guarantee-item::before {
            content: '•';
            margin-right: 6px;
            color: var(--gold-primary);
        }

        /* Footer Copyright */
        .footer-info {
            font-size: 0.65rem;
            color: rgba(143, 160, 149, 0.5);
            margin-top: 40px;
            letter-spacing: 0.05em;
        }

        /* Animations */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(4px); }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="header-badge">
            India's #1 Consultancy Channel
        </div>

        <div class="logo-outer-ring">
            <div class="logo-inner-ring">
                <div class="logo-core">
                    <svg class="logo-svg" viewBox="0 0 160 100" xmlns="http://www.w3.org/2000/svg">
                        <path d="M 50 55 A 18 18 0 1 1 110 55" stroke="#229ED9" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                        <rect x="64" y="44" width="5" height="12" fill="#229ED9" rx="1"/>
                        <rect x="73" y="38" width="5" height="18" fill="#229ED9" rx="1"/>
                        <rect x="82" y="32" width="5" height="24" fill="#229ED9" rx="1"/>
                        <rect x="91" y="24" width="5" height="32" fill="#229ED9" rx="1"/>
                        <text x="80" y="74" font-family="'Montserrat', sans-serif" font-weight="900" font-size="13" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">MARUTI</text>
                        <text x="80" y="86" font-family="'Montserrat', sans-serif" font-weight="600" font-size="6" fill="#229ED9" text-anchor="middle" letter-spacing="1.5">— CONSULTANCY —</text>
                    </svg>
                </div>
            </div>
        </div>

        <div>
            <h1 class="brand-title">MARUTI<br>CONSULTANCY</h1>
            <p class="brand-subtitle">OFFICIAL TELEGRAM CHANNEL</p>
            <div class="brand-taglines">
                <span>Market Insights</span>
                <span class="diamond-separator">♦</span>
                <span>Wealth Strategies</span>
            </div>
        </div>

        <div class="cta-section">
            <div class="tap-to-join">
                <span>TAP BELOW TO JOIN</span>
                <span class="arrow-down">↓</span>
            </div>
            
            <a href="https://t.me/your_telegram_channel" class="join-btn" target="_blank">
                <svg class="telegram-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15.45-1.54 6.42-2.27 9.8-.1.45-.44.6-.74.62-.64.04-1.13-.43-1.75-.83-.97-.63-1.52-1.02-2.46-1.64-1.09-.72-.38-1.12.24-1.76.16-.17 2.97-2.72 3.02-2.95.01-.03.01-.15-.06-.21-.07-.06-.17-.04-.25-.02-.11.02-1.88 1.19-5.32 3.51-.5.35-.96.52-1.37.51-.45-.01-1.32-.26-1.97-.47-.8-.26-1.43-.4-1.37-.85.03-.23.35-.47.96-.72 3.75-1.63 6.25-2.71 7.5-3.23 3.57-1.47 4.31-1.73 4.8-.17.1.32.08.68-.07.82z"/>
                </svg>
                JOIN TELEGRAM
            </a>

            <div class="progress-container">
                <p class="timer-text">Auto-joining in <span id="countdown" class="timer-seconds">48</span>s</p>
                <div class="progress-bar-bg">
                    <div id="progress-bar" class="progress-bar-fill"></div>
                </div>
            </div>

            <div class="guarantees">
                <span class="guarantee-item">Click to join</span>
                <span class="guarantee-item">No spam</span>
                <span class="guarantee-item">Unsubscribe anytime</span>
            </div>
        </div>

        <div class="footer-info">
            © 2026 Maruti Consultancy · Powered by Telegram
        </div>

    </div>

    <script>
        const duration = 48; // Countdown length in seconds
        let remainingTime = duration;
        
        const countdownEl = document.getElementById('countdown');
        const progressBarEl = document.getElementById('progress-bar');

        const interval = setInterval(() => {
            remainingTime--;
            
            // Update Text
            if (remainingTime >= 0) {
                countdownEl.textContent = remainingTime;
            }

            // Update Progress Bar width
            const percentage = (remainingTime / duration) * 100;
            progressBarEl.style.width = `${Math.max(0, percentage)}%`;

            if (remainingTime <= 0) {
                clearInterval(interval);
                // Optional: Trigger action when countdown hits 0 (e.g., redirecting to the Telegram channel)
                // window.location.href = "https://t.me/your_telegram_channel";
            }
        }, 1000);
    </script>
</body>
</html>
